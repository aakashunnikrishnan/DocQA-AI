version: '3.8'

services:
  # Main API service
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: docqa-api
    ports:
      - "8000:8000"
      - "9090:9090"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://docqa:docqa123@postgres:5432/docqa
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./config:/app/config:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - docqa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: docqa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - docqa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for metadata storage
  postgres:
    image: postgres:15-alpine
    container_name: docqa-postgres
    environment:
      - POSTGRES_USER=docqa
      - POSTGRES_PASSWORD=docqa123
      - POSTGRES_DB=docqa
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - docqa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docqa -d docqa"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant vector database (optional, can use FAISS instead)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: docqa-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    networks:
      - docqa-network
    restart: unless-stopped
    profiles:
      - vector-store
      - full

  # Jupyter notebook server for development
  jupyter:
    build:
      context: .
      dockerfile: docker/Dockerfile.jupyter
    container_name: docqa-jupyter
    ports:
      - "8888:8888"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./notebooks:/app/notebooks
      - ./data:/app/data
      - ./src:/app/src
    networks:
      - docqa-network
    restart: unless-stopped
    profiles:
      - dev
      - full

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: docqa-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - docqa-network
    restart: unless-stopped
    profiles:
      - monitoring
      - full

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: docqa-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - docqa-network
    restart: unless-stopped
    profiles:
      - monitoring
      - full

  # Nginx for reverse proxy and load balancing
  nginx:
    image: nginx:alpine
    container_name: docqa-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend:/usr/share/nginx/html
      - ./docker/ssl:/etc/nginx/ssl
    depends_on:
      - api
    networks:
      - docqa-network
    restart: unless-stopped
    profiles:
      - production
      - full

  # Background worker for async tasks
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: docqa-worker
    command: celery -A src.utils.celery_app worker --loglevel=info
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://docqa:docqa123@postgres:5432/docqa
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - docqa-network
    restart: unless-stopped
    profiles:
      - worker
      - full

  # Flower for Celery monitoring
  flower:
    image: mher/flower:latest
    container_name: docqa-flower
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_PORT=5555
    depends_on:
      - redis
      - worker
    networks:
      - docqa-network
    restart: unless-stopped
    profiles:
      - monitoring
      - full

networks:
  docqa-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  qdrant-data:
  prometheus-data:
  grafana-data:
