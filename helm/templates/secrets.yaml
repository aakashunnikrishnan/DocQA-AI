apiVersion: v1
kind: Secret
metadata:
  name: {{ include "docqa-ai.fullname" . }}-secrets
  labels:
    {{- include "docqa-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.dbPassword }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  {{- else if .Values.postgresql.enabled }}
  DB_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  {{- end }}

  {{- if .Values.secrets.redisPassword }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  {{- else if .Values.redis.enabled }}
  REDIS_PASSWORD: {{ .Values.redis.auth.password | quote }}
  {{- end }}

  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}
  API_KEYS: {{ .Values.secrets.apiKeys | quote }}
