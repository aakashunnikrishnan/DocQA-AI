apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: docqa
  labels:
    app: docqa-ai
    component: postgres
spec:
  selector:
    app: docqa-ai
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  clusterIP: None  # Headless service for statefulset
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: docqa
  labels:
    app: docqa-ai
    component: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: docqa-ai
      component: postgres
  template:
    metadata:
      labels:
        app: docqa-ai
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: docqa
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docqa-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: docqa
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - docqa
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - docqa
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: docqa
  labels:
    app: docqa-ai
    component: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
