[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test options
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --maxfail=1
    -p no:cacheprovider

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    performance: Performance tests
    requires_api: Tests that require API keys

# Test coverage
testpaths = tests
norecursedirs = .git .venv venv env __pycache__
